<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heritage Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   HERITAGE LEARNING HUB — Demo Stylesheet
   Maroon #7B2D26 · Gold #D4A017 · Cream #FAF6F0
   ========================================================= */
:root{
  --maroon:#7B2D26; --maroon-dark:#5A1F1A;
  --gold:#D4A017; --gold-light:#F1C453;
  --cream:#FAF6F0; --white:#FFFFFF;
  --ink:#2C2C2C; --muted:#7A736C; --line:#E8E0D4;
  --green:#1B5E20; --blue:#1E4E8C; --red:#B3261E;
  --radius:14px;
  --shadow:0 6px 20px rgba(90,31,26,.08);
  --shadow-lg:0 12px 34px rgba(90,31,26,.15);
  --sidebar-w:250px; --topbar-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Poppins',sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:'Playfair Display',serif;color:var(--maroon);line-height:1.25;font-weight:700}
a{color:inherit;text-decoration:none;cursor:pointer}
.hidden{display:none !important}
.container{max-width:1180px;margin:0 auto;padding:0 24px}
.muted{color:var(--muted);font-size:13.5px}
.link{color:var(--maroon);font-weight:500;cursor:pointer}
.link:hover{color:var(--gold)}
.center{text-align:center}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 20px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:500;
  border:1.5px solid transparent;cursor:pointer;transition:.2s;white-space:nowrap}
.btn-primary{background:var(--maroon);color:#fff;box-shadow:0 4px 12px rgba(123,45,38,.25)}
.btn-primary:hover{background:var(--maroon-dark);transform:translateY(-1px)}
.btn-outline{background:transparent;color:var(--maroon);border-color:var(--maroon)}
.btn-outline:hover{background:var(--maroon);color:#fff}
.btn-ghost{background:transparent;color:var(--maroon);border-color:var(--maroon)}
.btn-ghost:hover{background:var(--maroon);color:#fff}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn-lg{padding:14px 28px;font-size:15px}
.btn-block{width:100%}
.btn-danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}

/* ---------- PUBLIC HEADER ---------- */
.site-header{position:sticky;top:0;z-index:50;background:rgba(250,246,240,.95);
  backdrop-filter:blur(8px);border-bottom:2px solid var(--gold)}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 24px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Playfair Display',serif;
  font-size:19px;font-weight:600;color:var(--maroon);cursor:pointer}
.logo b{color:var(--gold)}
.logo-mark{font-size:24px}
.logo.center{justify-content:center;font-size:18px}
.main-nav{display:flex;align-items:center;gap:26px}
.main-nav a{font-size:14.5px;font-weight:500;color:#3A342E;cursor:pointer;transition:.2s}
.main-nav a:hover{color:var(--maroon)}

/* ---------- HERO ---------- */
.hero{position:relative;min-height:620px;display:flex;align-items:center;
  background:#5A1F1A url('https://images.unsplash.com/photo-1564507592333-c60657eea523?w=1600') center/cover no-repeat}
.hero-overlay{position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(90,31,26,.82) 0%,rgba(123,45,38,.7) 55%,rgba(212,160,23,.55) 100%)}
.hero-content{position:relative;color:#fff;padding:80px 24px;max-width:900px}
.hero .eyebrow{display:inline-block;font-size:12px;letter-spacing:2px;text-transform:uppercase;
  padding:6px 14px;background:rgba(212,160,23,.25);border:1px solid rgba(241,196,83,.6);
  border-radius:999px;color:#FFE9A8;margin-bottom:18px;font-weight:500}
.hero h1{color:#fff;font-size:clamp(34px,5vw,58px);font-weight:900;margin-bottom:16px;letter-spacing:-.5px}
.hero-sub{font-size:17px;max-width:620px;opacity:.92;margin-bottom:30px;color:#F5E6D3}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:52px}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:20px;max-width:720px;border-top:1px solid rgba(255,255,255,.25);padding-top:26px}
.hero-stats div b{display:block;font-family:'Playfair Display',serif;font-size:28px;color:#FFD966;line-height:1.1}
.hero-stats div span{font-size:12.5px;letter-spacing:.5px;color:#F5E6D3;text-transform:uppercase}

/* ---------- SECTIONS ---------- */
.section{padding:80px 0}
.section.alt{background:#fff}
.section-head{text-align:center;margin-bottom:44px}
.section-head h2{font-size:34px;margin-bottom:8px}
.section-head p{color:var(--muted);font-size:15px}

/* ---------- CARDS ---------- */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.h-card{background:#fff;border-radius:var(--radius);overflow:hidden;
  border:1px solid #F1EADF;box-shadow:var(--shadow);transition:.25s;display:flex;flex-direction:column}
.h-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.h-card-img{height:170px;background-size:cover;background-position:center;background-color:#EAE2D5}
.h-card-body{padding:18px 20px 22px}
.h-card-body h3{font-size:18px;margin:8px 0 6px}
.h-card-body p{font-size:14px;color:#4A443E;margin-bottom:10px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:#FDF4DC;
  color:#A87D0B;font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.tag.light{background:rgba(255,255,255,.85);color:var(--maroon)}

/* ---------- ABOUT / KPI ---------- */
.about-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:44px;align-items:center}
.about-grid h2{font-size:32px;margin-bottom:14px}
.about-grid p{color:#4A443E;margin-bottom:16px}
.check-list{list-style:none;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.about-card{background:linear-gradient(160deg,var(--maroon),var(--maroon-dark));
  color:#F5E6D3;padding:32px;border-radius:var(--radius);
  box-shadow:var(--shadow-lg);border:1px solid rgba(212,160,23,.3)}
.about-card h3{color:#FFD966;margin-bottom:10px;font-size:20px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px}
.kpi{background:#fff;border:1px solid #F1EADF;border-radius:var(--radius);
  padding:30px 20px;text-align:center;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:'Playfair Display',serif;font-size:36px;color:var(--maroon);line-height:1}
.kpi span{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* ---------- FOOTER ---------- */
.site-footer{background:#3A1915;color:#E9DDC9;padding:52px 0 0;margin-top:40px}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px;padding-bottom:36px}
.site-footer h4,.site-footer h5{color:#FFD966;margin-bottom:12px}
.site-footer h4{font-size:20px}
.site-footer h5{font-size:15px}
.site-footer p,.site-footer a{font-size:14px;color:#D8C9AE;display:block;margin-bottom:6px}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding:18px 24px;
  text-align:center;font-size:13px;color:#B9A98F}

/* ---------- AUTH ---------- */
.auth-body{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:#5A1F1A url('https://images.unsplash.com/photo-1524492412937-b28074a5d7da?w=1600') center/cover no-repeat}
.auth-wrap{width:100%;max-width:460px}
.auth-card{background:#fff;border-radius:18px;padding:34px 30px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:5px solid var(--gold)}
.auth-card h2{font-size:24px;margin:18px 0 4px;text-align:center}
.auth-card .muted{text-align:center;margin-bottom:22px}
.form{display:flex;flex-direction:column;gap:14px}
.form label{font-size:13.5px;font-weight:500;color:#4A443E;display:flex;flex-direction:column;gap:6px}
.form input,.form select,.form textarea{
  padding:11px 14px;border:1px solid var(--line);border-radius:9px;
  font-family:inherit;font-size:14px;background:#FCFAF6;outline:none;transition:.2s;width:100%}
.form input:focus,.form select:focus,.form textarea:focus{
  border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(212,160,23,.15)}
.alert{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:14px;border-left:4px solid}
.alert.success{background:#E9F6EC;color:#14471B;border-color:var(--green)}
.alert.error{background:#FBEAE6;color:#7A1A12;border-color:var(--red)}

/* ---------- DEMO PANEL ---------- */
.demo-box{margin-top:22px;padding:18px;background:#FCFAF6;
  border:1px dashed #D4A017;border-radius:12px}
.demo-title{font-size:12.5px;font-weight:600;color:var(--maroon);
  letter-spacing:.3px;text-transform:uppercase;margin-bottom:12px}
.demo-title code{background:#F1EADF;padding:2px 6px;border-radius:4px;
  font-size:11.5px;text-transform:none;letter-spacing:0;color:var(--ink)}
.demo-list{display:flex;flex-direction:column;gap:8px}
.demo-item{display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:#fff;border:1px solid #E8E0D4;border-radius:10px;cursor:pointer;transition:.2s}
.demo-item:hover{border-color:var(--gold);background:#FFFCF3;transform:translateX(3px)}
.demo-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-family:'Playfair Display',serif;font-weight:700;font-size:16px;color:#fff;flex-shrink:0}
.demo-avatar.s{background:linear-gradient(135deg,#1E4E8C,#3B7DD8)}
.demo-avatar.t{background:linear-gradient(135deg,#1B5E20,#2E7D32)}
.demo-avatar.a{background:linear-gradient(135deg,#7B2D26,#5A1F1A)}
.demo-info{flex:1;display:flex;flex-direction:column;line-height:1.3}
.demo-info b{font-size:13.5px;color:var(--ink)}
.demo-info span{font-size:11.5px;color:var(--muted);
  font-family:'SF Mono', Menlo, Consolas, monospace}
.demo-arrow{color:var(--maroon);font-weight:600;transition:transform .2s}
.demo-item:hover .demo-arrow{transform:translateX(4px)}

/* ---------- DASHBOARD ---------- */
.dash-body{padding-top:var(--topbar-h);padding-left:var(--sidebar-w)}
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);
  background:#fff;border-bottom:2px solid var(--gold);display:flex;
  align-items:center;gap:18px;padding:0 22px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.hamburger{display:none;background:none;border:none;font-size:22px;
  color:var(--maroon);cursor:pointer}
.topbar-logo{display:flex;align-items:center;gap:10px;
  font-family:'Playfair Display',serif;font-size:18px;color:var(--maroon);
  font-weight:600;cursor:pointer}
.topbar-logo b{color:var(--gold)}
.topbar-search{flex:1;max-width:420px}
.topbar-search input{width:100%;padding:9px 14px;border:1px solid var(--line);
  border-radius:999px;background:#FCFAF6;font-family:inherit;font-size:14px;
  outline:none;transition:.2s}
.topbar-search input:focus{border-color:var(--gold);background:#fff;
  box-shadow:0 0 0 3px rgba(212,160,23,.15)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.role-badge{padding:4px 11px;border-radius:999px;font-size:11.5px;
  font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.role-student{background:#E8F1FA;color:var(--blue)}
.role-teacher{background:#E9F6EC;color:var(--green)}
.role-admin{background:#FBEAE6;color:var(--maroon)}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;
  background:#FCFAF6;border:1px solid var(--line);border-radius:999px}
.user-chip .avatar{width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,var(--maroon),var(--maroon-dark));color:#fff;
  display:grid;place-items:center;font-weight:600;font-size:14px}
.user-chip .user-name{font-size:13.5px;font-weight:500;color:var(--ink)}
.logout-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:#FCFAF6;border:1px solid var(--line);font-size:16px;color:var(--maroon);
  transition:.2s;cursor:pointer}
.logout-btn:hover{background:var(--maroon);color:#fff;border-color:var(--maroon)}

/* ---------- SIDEBAR ---------- */
.sidebar{position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--sidebar-w);
  background:linear-gradient(180deg,#7B2D26 0%,#5A1F1A 100%);
  overflow-y:auto;padding:22px 0;z-index:90}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.side-section{padding:16px 24px 6px;font-size:10.5px;letter-spacing:1.4px;
  text-transform:uppercase;color:#E9C57E;opacity:.85;font-weight:600}
.side-nav a{display:flex;align-items:center;gap:12px;padding:11px 24px;
  color:#F5E6D3;font-size:14.5px;border-left:4px solid transparent;transition:.18s;cursor:pointer}
.side-nav a .ico{font-size:16px;width:20px;display:inline-block;text-align:center}
.side-nav a:hover{background:rgba(255,255,255,.06);color:#FFF;padding-left:28px}
.side-nav a.active{background:rgba(212,160,23,.16);border-left-color:var(--gold);
  color:var(--gold-light);font-weight:600}

/* ---------- MAIN ---------- */
.main-content{padding:30px 34px 60px;min-height:calc(100vh - var(--topbar-h))}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;
  gap:20px;margin-bottom:24px;flex-wrap:wrap}
.page-head h1{font-size:28px}
.page-head .muted{margin-top:4px}
.page-actions{display:flex;gap:10px;flex-wrap:wrap}
.panel{background:#fff;border-radius:var(--radius);padding:24px 26px;
  box-shadow:var(--shadow);border:1px solid #F1EADF;margin-bottom:22px}
.panel.narrow{max-width:560px}
.panel h2{font-size:19px;margin-bottom:14px;color:var(--maroon)}
.panel-head{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;gap:14px;flex-wrap:wrap}
.panel-head h2{margin:0}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:18px;margin-bottom:26px}
.stat-card{background:#fff;border-radius:var(--radius);padding:20px;
  display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);
  border:1px solid #F1EADF;transition:.2s}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.stat-card b{display:block;font-family:'Playfair Display',serif;
  font-size:26px;color:var(--maroon);line-height:1.1}
.stat-card span{font-size:12.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;font-weight:500}
.stat-icon{width:52px;height:52px;border-radius:14px;display:grid;
  place-items:center;font-size:22px;flex-shrink:0}
.stat-icon.maroon{background:#FBEAE6;color:var(--maroon)}
.stat-icon.gold{background:#FDF4DC;color:#A87D0B}
.stat-icon.green{background:#E9F6EC;color:var(--green)}
.stat-icon.blue{background:#E8F1FA;color:var(--blue)}

/* ---------- CATEGORY / MODULE CARDS ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.cat-card{background:#fff;border-radius:var(--radius);padding:28px 20px;text-align:center;
  border:1px solid #F1EADF;box-shadow:var(--shadow);transition:.2s;cursor:pointer}
.cat-card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:var(--shadow-lg)}
.cat-emoji{font-size:38px;margin-bottom:10px}
.cat-card h3{font-size:17px;margin-bottom:4px}
.module-card{background:#fff;border-radius:var(--radius);padding:22px;
  border:1px solid #F1EADF;box-shadow:var(--shadow);display:flex;
  flex-direction:column;gap:10px;transition:.2s}
.module-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.module-card h3{font-size:17px}
.module-card .btn{margin-top:auto;align-self:flex-start}
.module-list{list-style:none}
.module-list li{display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.module-list li:last-child{border-bottom:none}

/* ---------- FILTERS ---------- */
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;
  background:#fff;padding:16px;border-radius:var(--radius);
  border:1px solid #F1EADF;box-shadow:var(--shadow)}
.filters input,.filters select{padding:10px 14px;border:1px solid var(--line);
  border-radius:9px;font-family:inherit;font-size:14px;background:#FCFAF6;
  outline:none;transition:.2s}
.filters input{flex:1;min-width:180px}
.filters input:focus,.filters select:focus{border-color:var(--gold);
  background:#fff;box-shadow:0 0 0 3px rgba(212,160,23,.15)}

/* ---------- TABLES ---------- */
.data-table{width:100%;border-collapse:collapse;font-size:14px}
.data-table thead th{text-align:left;padding:12px 14px;background:#FCFAF6;
  color:var(--maroon);font-size:12px;text-transform:uppercase;letter-spacing:.6px;
  border-bottom:2px solid var(--line);font-weight:600}
.data-table tbody td{padding:14px;border-bottom:1px solid var(--line);vertical-align:middle}
.data-table tbody tr:hover{background:#FCFAF6}
.data-table .actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- BADGES ---------- */
.badge{display:inline-block;padding:4px 10px;border-radius:999px;
  font-size:11.5px;font-weight:600;letter-spacing:.3px}
.badge.green{background:#E9F6EC;color:var(--green)}
.badge.gold{background:#FDF4DC;color:#A87D0B}
.badge.red{background:#FBEAE6;color:var(--red)}

/* ---------- DETAIL HERO ---------- */
.detail-hero{height:280px;border-radius:var(--radius);background-size:cover;
  background-position:center;overflow:hidden;position:relative;
  margin-bottom:22px;box-shadow:var(--shadow-lg);background-color:#5A1F1A}
.detail-overlay{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(60,20,15,.85) 100%);
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:28px 30px;color:#fff}
.detail-overlay h1{color:#fff;font-size:32px;margin:8px 0 4px}
.detail-overlay p{opacity:.9;font-size:14px}

/* ---------- QUIZ ---------- */
.quiz-form{display:flex;flex-direction:column;gap:18px}
.quiz-q .q{font-size:15px;margin-bottom:12px;color:var(--ink)}
.quiz-q .opt{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border:1px solid var(--line);border-radius:10px;margin-bottom:8px;
  cursor:pointer;transition:.15s;font-size:14px}
.quiz-q .opt:hover{background:#FCFAF6;border-color:var(--gold)}
.quiz-q .opt input{accent-color:var(--maroon)}
.result-panel{text-align:center}
.score-circle{width:130px;height:130px;border-radius:50%;margin:0 auto 18px;
  display:grid;place-items:center;
  background:conic-gradient(var(--gold) calc(var(--pct,0)*1%), #F1EADF 0);position:relative}
.score-circle::before{content:"";position:absolute;inset:12px;background:#fff;border-radius:50%}
.score-circle span{position:relative;font-family:'Playfair Display',serif;
  font-size:28px;font-weight:700;color:var(--maroon)}
.result-actions{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}

/* ---------- QUICK ACTIONS ---------- */
.quick-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}

/* ---------- MODAL ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(45,20,15,.6);backdrop-filter:blur(3px);
  display:grid;place-items:center;z-index:200;padding:24px}
.modal{background:#fff;border-radius:16px;padding:26px 28px;max-width:520px;
  width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:4px solid var(--gold);
  max-height:90vh;overflow:auto}
.modal h3{font-size:20px;margin-bottom:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

/* ---------- RESPONSIVE ---------- */
@media (max-width:900px){
  .dash-body{padding-left:0}
  .sidebar{transform:translateX(-100%);transition:transform .28s ease}
  .sidebar.open{transform:translateX(0);box-shadow:6px 0 24px rgba(0,0,0,.25)}
  .hamburger{display:block}
  .topbar-search{display:none}
  .user-chip .user-name{display:none}
  .main-content{padding:22px 18px 50px}
  .page-head h1{font-size:23px}
  .detail-overlay h1{font-size:24px}
  .about-grid,.footer-grid{grid-template-columns:1fr}
  .section{padding:60px 0}
}
@media (max-width:520px){
  .role-badge{display:none}
  .stat-grid{grid-template-columns:1fr 1fr}
  .stat-card{padding:14px}

/* ---------- DB HELPERS ---------- */
function db()   { return JSON.parse(localStorage.getItem('hlh_db')); }
function save(d){ localStorage.setItem('hlh_db', JSON.stringify(d)); }
function nextId(arr){ return arr.length ? Math.max(...arr.map(x=>x.id)) + 1 : 1; }

/* ---------- SESSION ---------- */
function user() {
  const id = localStorage.getItem('hlh_uid');
  if (!id) return null;
  return db().users.find(u => u.id === parseInt(id)) || null;
}
function setUser(u){ localStorage.setItem('hlh_uid', u.id); }
function logout()  { localStorage.removeItem('hlh_uid'); go('login'); }

/* ---------- ROUTER ---------- */
let route = 'home';
function go(r, params){
  route = r;
  window.__params = params || {};
  render();
  window.scrollTo(0, 0);
}

/* ---------- HELPERS ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function imgFor(name){ return HERITAGE_IMAGES[name] || 'https://images.unsplash.com/photo-1524492412937-b28074a5d7da?w=800'; }
function catName(id){ const c = db().categories.find(c => c.id === id); return c ? c.name : '—'; }
function stateName(id){ const s = db().states.find(s => s.id === id); return s ? s.name : '—'; }

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const u = user();
  if (route === 'login' || route === 'register') {
    document.getElementById('app').innerHTML = authView(route);
    return;
  }
  if (!u) { route = 'login'; document.getElementById('app').innerHTML = authView('login'); return; }
  if (route === 'dashboard')  document.getElementById('app').innerHTML = shell(u, dashboardView(u));
  else if (route === 'categories') document.getElementById('app').innerHTML = shell(u, categoriesView());
  else if (route === 'browse')     document.getElementById('app').innerHTML = shell(u, browseView());
  else if (route === 'detail')     document.getElementById('app').innerHTML = shell(u, detailView());
  else if (route === 'modules')    document.getElementById('app').innerHTML = shell(u, modulesView());
  else if (route === 'module')     document.getElementById('app').innerHTML = shell(u, moduleView());
  else if (route === 'quiz')       document.getElementById('app').innerHTML = shell(u, quizView());
  else if (route === 'result')     document.getElementById('app').innerHTML = shell(u, resultView());
  else if (route === 'progress')   document.getElementById('app').innerHTML = shell(u, progressView());
  else if (route === 'resources')  document.getElementById('app').innerHTML = shell(u, resourcesView());
  else if (route === 'classes')    document.getElementById('app').innerHTML = shell(u, classesView());
  else if (route === 'admin')      document.getElementById('app').innerHTML = shell(u, adminHomeView());
  else if (route === 'manage-heritage') document.getElementById('app').innerHTML = shell(u, manageHeritageView());
  else if (route === 'manage-modules')  document.getElementById('app').innerHTML = shell(u, manageModulesView());
  else if (route === 'manage-quizzes')  document.getElementById('app').innerHTML = shell(u, manageQuizzesView());
  else if (route === 'manage-users')    document.getElementById('app').innerHTML = shell(u, manageUsersView());
  else if (route === 'manage-master')   document.getElementById('app').innerHTML = shell(u, manageMasterView());
  else if (route === 'approve')         document.getElementById('app').innerHTML = shell(u, approveView());
  else if (route === 'profile')         document.getElementById('app').innerHTML = shell(u, profileView());
  else document.getElementById('app').innerHTML = shell(u, dashboardView(u));
}

/* =========================================================
   AUTH VIEW (login + register)
   ========================================================= */
function authView(kind){
  const isLogin = kind === 'login';
  return `
  <div class="auth-body">
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="logo center" onclick="go('home')">
          <span class="logo-mark">🏛️</span>
          <span>Heritage <b>Learning Hub</b></span>
        </div>

        <h2>${isLogin ? 'Welcome back' : 'Create your account'}</h2>
        <p class="muted">${isLogin ? 'Login to continue your heritage journey.' : 'Join as a student or teacher and start learning.'}</p>

        <div id="auth-alert"></div>

        <form class="form" onsubmit="return ${isLogin ? 'doLogin' : 'doRegister'}(event)">
          ${!isLogin ? `
          <label>Full Name<input type="text" id="reg-name" required></label>
          ` : ''}
          <label>Email<input type="email" id="${isLogin?'login':'reg'}-email" required></label>
          <label>Password<input type="password" id="${isLogin?'login':'reg'}-pass" required minlength="6"></label>
          ${!isLogin ? `
          <label>I am a
            <select id="reg-role">
              <option value="student">Student</option>
              <option value="teacher">Teacher</option>
            </select>
          </label>` : ''}
          <button class="btn btn-primary btn-block">${isLogin ? 'Login' : 'Create Account'}</button>
        </form>

        ${isLogin ? `
        <!-- DEMO LOGINS -->
        <div class="demo-box">
          <div class="demo-title">🔑 Demo Logins (password: <code>admin123</code>)</div>
          <div class="demo-list">
            <div class="demo-item" onclick="quickLogin('student')">
              <div class="demo-avatar s">R</div>
              <div class="demo-info"><b>Riya Sharma</b><span>Student · riya@student.in</span></div>
              <div class="demo-arrow">→</div>
            </div>
            <div class="demo-item" onclick="quickLogin('teacher')">
              <div class="demo-avatar t">V</div>
              <div class="demo-info"><b>Mr. Verma</b><span>Teacher · verma@teacher.in</span></div>
              <div class="demo-arrow">→</div>
            </div>
            <div class="demo-item" onclick="quickLogin('admin')">
              <div class="demo-avatar a">A</div>
              <div class="demo-info"><b>Admin</b><span>Admin · admin@heritage.in</span></div>
              <div class="demo-arrow">→</div>
            </div>
          </div>
        </div>` : ''}

        <p class="center muted" style="margin-top:14px">
          ${isLogin
            ? 'New here? <a class="link" onclick="go(\'register\')">Create an account</a>'
            : 'Already registered? <a class="link" onclick="go(\'login\')">Login</a>'}
        </p>
      </div>

/* ---------- DEMO QUICK LOGIN ---------- */
const DEMO_USERS = {
  student: { email: 'riya@student.in',  pass: 'admin123' },
  teacher: { email: 'verma@teacher.in', pass: 'admin123' },
  admin:   { email: 'admin@heritage.in', pass: 'admin123' }
};
function quickLogin(role){
  const d = DEMO_USERS[role];
  if (!d) return;
  const em = document.getElementById('login-email');
  const pw = document.getElementById('login-pass');
  em.value = d.email;
  pw.value = d.pass;
  em.style.boxShadow = pw.style.boxShadow = '0 0 0 4px rgba(212,160,23,.35)';
  setTimeout(() => {
    em.style.boxShadow = pw.style.boxShadow = '';
    doLogin({ preventDefault: () => {} });
  }, 350);
}

/* ---------- LOGIN / REGISTER ---------- */
function doLogin(e){
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const found = db().users.find(u => u.email === email && u.password === pass);
  const alertBox = document.getElementById('auth-alert');
  if (!found) { alertBox.innerHTML = '<div class="alert error">Invalid email or password.</div>'; return false; }
  setUser(found);
  go(found.role === 'admin' ? 'admin' : 'dashboard');
  return false;
}

function doRegister(e){
  e.preventDefault();
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass  = document.getElementById('reg-pass').value;
  const role  = document.getElementById('reg-role').value;
  const alertBox = document.getElementById('auth-alert');
  const d = db();
  if (d.users.some(u => u.email === email)) {
    alertBox.innerHTML = '<div class="alert error">Email already registered.</div>';
    return false;
  }
  d.users.push({ id: nextId(d.users), name, email, password: pass, role, created: new Date().toISOString().slice(0,10) });
  save(d);
  alertBox.innerHTML = '<div class="alert success">Account created! Please login.</div>';
  setTimeout(() => go('login'), 900);
  return false;
}

/* =========================================================
   SHELL (topbar + sidebar)
   ========================================================= */

  <header class="topbar">
    <button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
    <div class="topbar-logo" onclick="go('${u.role === 'admin' ? 'admin' : 'dashboard'}')">
      <span class="logo-mark">🏛️</span><span>Heritage <b>Learning Hub</b></span>
    </div>
    <div class="topbar-search"><input type="text" placeholder="Search heritage, modules…"></div>
    <div class="topbar-right">
      <span class="role-badge role-${u.role}">${u.role}</span>
      <div class="user-chip">
        <div class="avatar">${esc(u.name.charAt(0).toUpperCase())}</div>
        <span class="user-name">${esc(u.name)}</span>
      </div>
      <button class="logout-btn" onclick="logout()" title="Logout">⏻</button>
    </div>
  </header>
  <aside class="sidebar" id="sidebar">${sidebarHTML(u)}</aside>
  <main class="main-content">${content}</main>`;
}

  return `

/* =========================================================
   MODULE VIEW
   ========================================================= */
function moduleView(){
  const d = db();
  const u = user();
  const p = window.__params || {};
  const m = d.modules.find(x => x.id === p.id);
  if (!m) return `<div class="panel"><p>Module not found.</p></div>`;
  const h = d.heritage.find(x => x.id === m.heritage_id);

  // mark started
  if (u.role === 'student') {
    const found = d.progress.find(pr => pr.user_id === u.id && pr.module_id === m.id);
    if (!found) {
      d.progress.push({ user_id: u.id, module_id: m.id, status: 'started', updated: new Date().toISOString().slice(0,10) });
      save(d);
    }
  }

  return `
  <div class="page-head">
    <div>
      <h1>${esc(m.title)}</h1>
      <p class="muted">🏛️ ${esc(h ? h.name : '—')}</p>
    </div>
    <div class="page-actions">
      ${u.role === 'student' ? `<button class="btn btn-primary" onclick="go('quiz',{module:${m.id}})">Take Quiz</button>` : ''}
      <button class="btn btn-ghost" onclick="go('detail',{id:${m.heritage_id}})">← Back</button>
    </div>
  </div>

  <div class="panel">
    <h2>Module Content</h2>
    <p>${esc(m.content)}</p>
  </div>

  ${u.role === 'student' ? `
  <div class="panel">
    <h2>Mark Progress</h2>
    <p class="muted">Finished reading? Mark this module as completed.</p>
    <button class="btn btn-primary" style="margin-top:12px" onclick="completeModule(${m.id})">✔ I've finished this module</button>
    <div id="complete-msg" style="margin-top:12px"></div>
  </div>` : ''}`;
}
function completeModule(mid){
  const u = user();
  const d = db();
  const found = d.progress.find(p => p.user_id === u.id && p.module_id === mid);
  if (found) { found.status = 'completed'; found.updated = new Date().toISOString().slice(0,10); }
  else { d.progress.push({ user_id: u.id, module_id: mid, status: 'completed', updated: new Date().toISOString().slice(0,10) }); }
  save(d);
  document.getElementById('complete-msg').innerHTML = '<div class="alert success">Module marked as completed. Well done!</div>';
}

/* =========================================================
   QUIZ
   ========================================================= */
function quizView(){
  const d = db();
  const u = user();
  const p = window.__params || {};
  const moduleId = p.module || p.id;

  // No module → picker
  if (!moduleId) {
    const modulesWithQuiz = d.modules.filter(m => d.quizzes.some(q => q.module_id === m.id));
    return `
    <div class="page-head"><div><h1>Available Quizzes</h1><p class="muted">Pick a module to attempt its quiz.</p></div></div>
    ${modulesWithQuiz.length === 0
      ? `<div class="panel"><p class="muted">No quizzes available yet.</p></div>`
      : `<div class="card-grid">
          ${modulesWithQuiz.map(m => {
            const qc = d.quizzes.filter(q => q.module_id === m.id).length;
            const h = d.heritage.find(x => x.id === m.heritage_id);
            return `<article class="module-card">
              <h3>${esc(m.title)}</h3>
              <p class="muted">🏛️ ${esc(h ? h.name : '—')}</p>
              <p class="muted">📝 ${qc} question${qc===1?'':'s'}</p>
              <button class="btn btn-primary" onclick="go('quiz',{module:${m.id}})">Start Quiz</button>
            </article>`;
          }).join('')}
        </div>`}`;
  }

  const m = d.modules.find(x => x.id === moduleId);
  if (!m) return `<div class="panel"><p>Module not found.</p></div>`;
  const qs = d.quizzes.filter(q => q.module_id === moduleId);

  if (qs.length === 0) return `
    <div class="page-head"><div><h1>Quiz: ${esc(m.title)}</h1></div></div>
    <div class="panel"><p>No questions for this module yet.</p>
      <button class="btn btn-primary" style="margin-top:12px" onclick="go('quiz')">View Other Quizzes</button>
    </div>`;

  return `
  <div class="page-head">
    <div><h1>Quiz: ${esc(m.title)}</h1><p class="muted">${qs.length} question${qs.length===1?'':'s'}</p></div>
    <button class="btn btn-ghost" onclick="go('module',{id:${m.id}})">← Back to Module</button>
  </div>

  <form class="quiz-form" onsubmit="return submitQuiz(event, ${moduleId})">
    ${qs.map((q, i) => `
      <div class="quiz-q panel">
        <p class="q"><b>Q${i+1}.</b> ${esc(q.question)}</p>
        ${['A','B','C','D'].map(o => {
          const val = q['option_' + o.toLowerCase()];
          if (!val) return '';
          return `<label class="opt">
            <input type="radio" name="q${q.id}" value="${o}" required>
            ${esc(val)}
          </label>`;
        }).join('')}
      </div>`).join('')}
    <button class="btn btn-primary btn-lg">Submit Quiz</button>
  </form>`;
}

function submitQuiz(e, moduleId){
  e.preventDefault();
  const d = db();
  const u = user();
  const qs = d.quizzes.filter(q => q.module_id === moduleId);
  let score = 0;
  qs.forEach(q => {
    const el = document.querySelector(`input[name="q${q.id}"]:checked`);
    if (el && el.value === q.correct_option) score++;
  });
  const attempt = {
    id: nextId(d.attempts),
    user_id: u.id,
    module_id: moduleId,
    score,
    total: qs.length,
    date: new Date().toISOString().slice(0,10)
  };
  d.attempts.push(attempt);
  save(d);
  go('result', { attempt: attempt.id });
  return false;
}

    <div class="stat-card"><div class="stat-icon blue">📝</div><div><b>${d.quizzes.length}</b><span>Quiz Questions</span></div></div>
    <div class="stat-card"><div class="stat-icon green">🎯</div><div><b>${d.attempts.length}</b><span>Quiz Attempts</span></div></div>
    <div class="stat-card"><div class="stat-icon gold">⏳</div><div><b>${pending}</b><span>Pending Approvals</span></div></div>
  </div>

  <div class="panel">
    <h2>Quick Actions</h2>
    <div class="quick-actions">
      <button class="btn btn-primary" onclick="addHeritageModal()">+ Add Heritage</button>
      <button class="btn btn-ghost" onclick="go('manage-heritage')">Manage Heritage</button>
      <button class="btn btn-ghost" onclick="go('manage-modules')">Manage Modules</button>
      <button class="btn btn-ghost" onclick="go('manage-quizzes')">Manage Quizzes</button>
      <button class="btn btn-ghost" onclick="go('manage-users')">Manage Users</button>
      <button class="btn btn-ghost" onclick="go('approve')">Approve Content ${pending?'('+pending+')':''}</button>
    </div>
  </div>

  <div class="panel">
    <h2>Recently Added Heritage</h2>
    <table class="data-table">
      <thead><tr><th>Name</th><th>Category</th><th>State</th><th>Status</th><th>Added</th></tr></thead>
      <tbody>
        ${d.heritage.slice(-5).reverse().map(h => `
          <tr>
            <td><b>${esc(h.name)}</b></td>
            <td>${catName(h.category_id)}</td>
            <td>${stateName(h.state_id)}</td>
            <td><span class="badge ${h.status==='approved'?'green':(h.status==='pending'?'gold':'red')}">${h.status}</span></td>
            <td class="muted">${h.created}</td>
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

/* =========================================================
   ADMIN — Manage Heritage
   ========================================================= */
function manageHeritageView(){
  const d = db();
  return `
  <div class="page-head">
    <div><h1>Manage Heritage</h1><p class="muted">${d.heritage.length} item${d.heritage.length===1?'':'s'}</p></div>
    <button class="btn btn-primary" onclick="addHeritageModal()">+ Add New</button>
  </div>

  <div class="panel">
    <table class="data-table">
      <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>State</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        ${d.heritage.map(h => `
          <tr>
            <td>#${h.id}</td>
            <td><b>${esc(h.name)}</b></td>
            <td>${catName(h.category_id)}</td>
            <td>${stateName(h.state_id)}</td>
            <td><span class="badge ${h.status==='approved'?'green':(h.status==='pending'?'gold':'red')}">${h.status}</span></td>
            <td class="actions">
              <button class="btn btn-sm btn-ghost" onclick="go('detail',{id:${h.id}})">View</button>
              <button class="btn btn-sm btn-danger" onclick="deleteHeritage(${h.id})">Delete</button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}
function deleteHeritage(id){
  if (!confirm('Delete this heritage item?')) return;
  const d = db();
  d.heritage = d.heritage.filter(h => h.id !== id);
  d.modules = d.modules.filter(m => m.heritage_id !== id);
  save(d);
  render();
}

/* =========================================================
   ADMIN — Manage Modules
   ========================================================= */
function manageModulesView(){
  const d = db();
  return `
  <div class="page-head">
    <div><h1>Manage Modules</h1><p class="muted">${d.modules.length} module${d.modules.length===1?'':'s'}</p></div>
  </div>

  <div class="panel">
    <h2>Add New Module</h2>
    <form class="form" style="margin-top:12px" onsubmit="return addModule(event)">
      <label>Related Heritage
        <select id="mod-hid" required>
          <option value="">— Select Heritage —</option>
          ${d.heritage.map(h => `<option value="${h.id}">${esc(h.name)}</option>`).join('')}
        </select>
      </label>
      <label>Module Title<input type="text" id="mod-title" required></label>
      <label>Content<textarea id="mod-content" rows="4" required></textarea></label>
      <button class="btn btn-primary">+ Add Module</button>
    </form>
  </div>

  <div class="panel">
    <h2>All Modules</h2>
    <table class="data-table">
      <thead><tr><th>ID</th><th>Heritage</th><th>Title</th><th>Actions</th></tr></thead>
      <tbody>
        ${d.modules.map(m => {
          const h = d.heritage.find(x => x.id === m.heritage_id);
          return `<tr>
            <td>#${m.id}</td>
            <td>${esc(h ? h.name : '—')}</td>
            <td><b>${esc(m.title)}</b></td>
            <td><button class="btn btn-sm btn-danger" onclick="deleteModule(${m.id})">Delete</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}
function addModule(e){
  e.preventDefault();
  const d = db();
  d.modules.push({
    id: nextId(d.modules),
    heritage_id: parseInt(document.getElementById('mod-hid').value),
    title: document.getElementById('mod-title').value.trim(),
    content: document.getElementById('mod-content').value.trim()
  });
  save(d); render(); return false;
}
function deleteModule(id){
  if (!confirm('Delete this module and its quizzes?')) return;
  const d = db();
  d.modules = d.modules.filter(m => m.id !== id);
  d.quizzes = d.quizzes.filter(q => q.module_id !== id);
  save(d); render();
}

/* =========================================================
   ADMIN — Manage Quizzes
   ========================================================= */
function manageQuizzesView(){
  const d = db();
  return `
  <div class="page-head"><div><h1>Manage Quizzes</h1><p class="muted">${d.quizzes.length} question${d.quizzes.length===1?'':'s'}</p></div></div>

  <div class="panel">
    <h2>Add New Question</h2>
    <form class="form" style="margin-top:12px" onsubmit="return addQuiz(event)">
      <label>Module
        <select id="qz-mid" required>
          <option value="">— Select Module —</option>
          ${d.modules.map(m => `<option value="${m.id}">${esc(m.title)}</option>`).join('')}
        </select>
      </label>
      <label>Question<textarea id="qz-q" rows="2" required></textarea></label>
      <label>Option A<input type="text" id="qz-a" required></label>
      <label>Option B<input type="text" id="qz-b" required></label>
      <label>Option C<input type="text" id="qz-c"></label>
      <label>Option D<input type="text" id="qz-d"></label>
      <label>Correct
        <select id="qz-cor" required>
          <option value="">—</option>
          <option>A</option><option>B</option><option>C</option><option>D</option>
        </select>
      </label>
      <button class="btn btn-primary">+ Add Question</button>
    </form>
  </div>

  <div class="panel">
    <h2>All Questions</h2>
    <table class="data-table">
      <thead><tr><th>ID</th><th>Module</th><th>Question</th><th>Correct</th><th></th></tr></thead>
      <tbody>
        ${d.quizzes.map(q => {
          const m = d.modules.find(x => x.id === q.module_id);
          return `<tr>
            <td>#${q.id}</td>
            <td>${esc(m ? m.title : '—')}</td>
            <td>${esc(q.question)}</td>
            <td><span class="badge green">${q.correct_option}</span></td>
            <td><button class="btn btn-sm btn-danger" onclick="deleteQuiz(${q.id})">Delete</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}
function addQuiz(e){
  e.preventDefault();
  const d = db();
  d.quizzes.push({
    id: nextId(d.quizzes),
    module_id: parseInt(document.getElementById('qz-mid').value),
    question: document.getElementById('qz-q').value.trim(),
    option_a: document.getElementById('qz-a').value.trim(),
    option_b: document.getElementById('qz-b').value.trim(),
    option_c: document.getElementById('qz-c').value.trim(),
    option_d: document.getElementById('qz-d').value.trim(),
    correct_option: document.getElementById('qz-cor').value
  });
  save(d); render(); return false;
}
function deleteQuiz(id){
  if (!confirm('Delete this question?')) return;
  const d = db();
  d.quizzes = d.quizzes.filter(q => q.id !== id);
  save(d); render();
}

/* =========================================================
   ADMIN — Manage Users
   ========================================================= */
function manageUsersView(){
  const d = db();
  const me = user();
  return `
  <div class="page-head"><div><h1>Manage Users</h1><p class="muted">${d.users.length} user${d.users.length===1?'':'s'}</p></div></div>
  <div class="panel">
    <table class="data-table">
      <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr></thead>
      <tbody>
        ${d.users.map(u => `
          <tr>
            <td>#${u.id}</td>
            <td><b>${esc(u.name)}</b></td>
            <td>${esc(u.email)}</td>
            <td><span class="role-badge role-${u.role}">${u.role}</span></td>
            <td class="actions">
              ${u.id !== me.id ? `
                <button class="btn btn-sm btn-ghost" onclick="changeRole(${u.id})">Change Role</button>
                <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">Delete</button>
              ` : '<span class="muted">— you —</span>'}
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}
function changeRole(id){
  const d = db();
  const u = d.users.find(x => x.id === id);
  if (!u) return;
  const newRole = prompt(`New role for ${u.name} (student / teacher / admin):`, u.role);
  if (!newRole || !['student','teacher','admin'].includes(newRole)) return;
  u.role = newRole;
  save(d); render();
}
function deleteUser(id){
  if (!confirm('Delete this user?')) return;
  const d = db();
  d.users = d.users.filter(u => u.id !== id);
  save(d); render();
}

/* =========================================================
   ADMIN — Master (Categories + States)
   ========================================================= */
function manageMasterView(){
  const d = db();
  return `
  <div class="page-head"><div><h1>Categories &amp; States</h1></div></div>

  <div class="card-grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">
    <div class="panel">
      <h2>Categories</h2>
      <form class="form" style="flex-direction:row;gap:8px;margin:12px 0 18px" onsubmit="return addMaster(event,'category')">
        <input type="text" id="new-cat" placeholder="New category…" required style="flex:1">
        <button class="btn btn-primary">Add</button>
      </form>
      <table class="data-table">
        <thead><tr><th>Name</th><th>Items</th><th></th></tr></thead>
        <tbody>
          ${d.categories.map(c => {
            const count = d.heritage.filter(h => h.category_id === c.id).length;
            return `<tr>
              <td><b>${esc(c.name)}</b></td>
              <td>${count}</td>
              <td><button class="btn btn-sm btn-danger" onclick="deleteMaster('category',${c.id})">Delete</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <div class="panel">
      <h2>States</h2>
      <form class="form" style="flex-direction:row;gap:8px;margin:12px 0 18px" onsubmit="return addMaster(event,'state')">
        <input type="text" id="new-state" placeholder="New state…" required style="flex:1">
        <button class="btn btn-primary">Add</button>
      </form>
      <table class="data-table">
        <thead><tr><th>Name</th><th>Items</th><th></th></tr></thead>
        <tbody>
          ${d.states.map(s => {
            const count = d.heritage.filter(h => h.state_id === s.id).length;
            return `<tr>
              <td><b>${esc(s.name)}</b></td>
              <td>${count}</td>
              <td><button class="btn btn-sm btn-danger" onclick="deleteMaster('state',${s.id})">Delete</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}
function addMaster(e, kind){
  e.preventDefault();
  const d = db();
  const inputId = kind === 'category' ? 'new-cat' : 'new-state';
  const name = document.getElementById(inputId).value.trim();
  if (!name) return false;
  const list = kind === 'category' ? d.categories : d.states;
  if (list.some(x => x.name.toLowerCase() === name.toLowerCase())) { alert('Already exists.'); return false; }
  list.push({ id: nextId(list), name });
  save(d); render(); return false;
}
function deleteMaster(kind, id){
  if (!confirm('Delete this item?')) return;
  const d = db();
  if (kind === 'category') d.categories = d.categories.filter(c => c.id !== id);
  else                     d.states = d.states.filter(s => s.id !== id);
  save(d); render();
}

/* =========================================================
   ADMIN — Approve Content
   ========================================================= */
function approveView(){
  const d = db();
  const pending  = d.heritage.filter(h => h.status === 'pending');
  const approved = d.heritage.filter(h => h.status === 'approved').length;
  const rejected = d.heritage.filter(h => h.status === 'rejected').length;

  return `
  <div class="page-head"><div><h1>Approve Content</h1><p class="muted">Review pending submissions.</p></div></div>

  <div class="stat-grid">
    <div class="stat-card"><div class="stat-icon gold">⏳</div><div><b>${pending.length}</b><span>Pending</span></div></div>
    <div class="stat-card"><div class="stat-icon green">✔</div><div><b>${approved}</b><span>Approved</span></div></div>
    <div class="stat-card"><div class="stat-icon maroon">✖</div><div><b>${rejected}</b><span>Rejected</span></div></div>
  </div>

  <div class="panel">
    <h2>Pending Submissions</h2>
    ${pending.length === 0 ? `<p class="muted">No pending submissions — everything is up to date.</p>` :
      `<table class="data-table">
        <thead><tr><th>Name</th><th>Category</th><th>State</th><th>Added</th><th>Actions</th></tr></thead>
        <tbody>
          ${pending.map(h => `
            <tr>
              <td><b>${esc(h.name)}</b></td>
              <td>${catName(h.category_id)}</td>
              <td>${stateName(h.state_id)}</td>
              <td class="muted">${h.created}</td>
              <td class="actions">
                <button class="btn btn-sm btn-primary" onclick="setStatus(${h.id},'approved')">✔ Approve</button>
                <button class="btn btn-sm btn-danger" onclick="setStatus(${h.id},'rejected')">✖ Reject</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`}
  </div>`;
}
function setStatus(id, status){
  const d = db();
  const h = d.heritage.find(x => x.id === id);
  if (h) h.status = status;
  save(d); render();
}

/* =========================================================
   PROFILE
   ========================================================= */
function profileView(){
  const u = user();
  return `
  <div class="page-head"><div><h1>My Profile</h1></div></div>
  <div class="panel narrow">
    <form class="form" onsubmit="return saveProfile(event)">
      <label>Full Name<input type="text" id="pf-name" value="${esc(u.name)}" required></label>
      <label>Email<input type="email" value="${esc(u.email)}" disabled></label>
      <label>Role<input type="text" value="${u.role}" disabled></label>
      <button class="btn btn-primary">Save Changes</button>
    </form>
    <div id="pf-msg" style="margin-top:12px"></div>
  </div>`;
}
function saveProfile(e){
  e.preventDefault();
  const d = db();
  const u = user();
  const me = d.users.find(x => x.id === u.id);
  me.name = document.getElementById('pf-name').value.trim();
  save(d);
  document.getElementById('pf-msg').innerHTML = '<div class="alert success">Profile updated.</div>';
  setTimeout(() => render(), 600);
  return false;
}

/* =========================================================
   ADMIN — Add Heritage Modal
   ========================================================= */
function addHeritageModal(){
  const d = db();
  const html = `
  <div class="modal-bg" id="modal" onclick="if(event.target.id==='modal')closeModal()">
    <div class="modal">
      <h3>Add New Heritage</h3>
      <form class="form" onsubmit="return submitNewHeritage(event)">
        <label>Name<input type="text" id="nh-name" required></label>
        <label>Category
          <select id="nh-cat" required>
            <option value="">— Select —</option>
            ${d.categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}
          </select>
        </label>
        <label>State
          <select id="nh-state" required>
            <option value="">— Select —</option>
            ${d.states.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}
          </select>
        </label>
        <label>Time Period<input type="text" id="nh-period" placeholder="e.g. 1632–1653 CE"></label>
        <label>Description<textarea id="nh-desc" rows="4" required></textarea></label>
        <label>Image
          <select id="nh-img">
            ${Object.keys(HERITAGE_IMAGES).map(k => `<option value="${k}">${k.replace(/-/g,' ')}</option>`).join('')}
          </select>
        </label>
        <label>Status
          <select id="nh-status">
            <option value="approved">Approved</option>
            <option value="pending">Pending</option>
            <option value="rejected">Rejected</option>
          </select>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary">Save Heritage</button>
        </div>
      </form>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}
function closeModal(){
  const m = document.getElementById('modal');
  if (m) m.remove();
}
function submitNewHeritage(e){
  e.preventDefault();
  const d = db();
  d.heritage.push({
    id: nextId(d.heritage),
    name: document.getElementById('nh-name').value.trim(),
    category_id: parseInt(document.getElementById('nh-cat').value),
    state_id: parseInt(document.getElementById('nh-state').value),
    time_period: document.getElementById('nh-period').value.trim(),
    description: document.getElementById('nh-desc').value.trim(),
    image: document.getElementById('nh-img').value,
    status: document.getElementById('nh-status').value,
    created_by: user().id,
    created: new Date().toISOString().slice(0,10)
  });
  save(d); closeModal(); render();
  return false;
}

/* =========================================================
   BOOT
   ========================================================= */
seedDB();
const existing = user();
if (existing) {
  route = existing.role === 'admin' ? 'admin' : 'dashboard';
} else {
  route = 'login';
}
render();
</script>
